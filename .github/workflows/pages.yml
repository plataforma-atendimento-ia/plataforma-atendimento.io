name: Publicar site de vendas

# Publica app/static/site/index.html no GitHub Pages a cada mudança nele.
# Os botões "/app/" do site apontam para o sistema de atendimento. No Pages o sistema não existe,
# então o link é trocado pela variável do repositório APP_URL (Settings > Secrets and variables >
# Actions > Variables). Sem a variável, os botões levam ao fim da página (#cta).

on:
  push:
    branches: [main]
    paths:
      - "app/static/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          mkdir _site
          cp app/static/site/index.html _site/index.html
          if [ -z "$APP_URL" ]; then APP_URL="#cta"; fi
          sed -i "s|href=\"/app/\"|href=\"${APP_URL}\"|g" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
